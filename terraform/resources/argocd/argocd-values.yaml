crds:
  install: true

server:
  service:
    type: ClusterIP

configs:
  params:
    server.insecure: true
  cm:
    # URL publique utilisee par OIDC et les liens ArgoCD.
    url: https://argocd.streamixs.com
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec --enable-helm --load-restrictor LoadRestrictionsNone"
    application.instanceLabelKey: "argocd.argoproj.io/instance"
  rbac:
    # Les utilisateurs OIDC non listes explicitement restent en lecture seule.
    # L'admin local reste disponible comme acces de secours.
    policy.default: role:readonly

controller:
  extraArgs:
    # Le rendu Helm/Kustomize de monitoring depasse 60 s.
    # Doit rester superieur a ARGOCD_EXEC_TIMEOUT du repo-server.
    - --repo-server-timeout-seconds=360
    # Evite de lancer tous les rendus lourds en meme temps.
    - --status-processors=10
    - --operation-processors=5

repoServer:
  # Deux replicas pour absorber les rendus Helm concurrents.
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # Use init containers to configure custom tooling
  # https://argoproj.github.io/argo-cd/operator-manual/custom_tools/
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      # renovate: datasource=docker depName=viaductoss/ksops
      image: viaductoss/ksops:v4.3.3
      command: ["/bin/sh", "-c"]
      args:
        - echo "Installing KSOPS...";
          mv ksops /custom-tools/;
          mv kustomize /custom-tools/;
          echo "Done.";
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /etc/sops/age
      name: sops-age
      readOnly: true
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /etc/sops/age/keys.txt
    # Le rendu kustomize/Helm de monitoring depasse le defaut de 90 s.
    - name: ARGOCD_EXEC_TIMEOUT
      value: "300s"
