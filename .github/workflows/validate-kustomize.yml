name: Validate kustomize + kubeconform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-kustomize-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: 5.8.3
  KUBECONFORM_VERSION: 0.8.0
  HELM_VERSION: v3.16.4
  KUBERNETES_VERSION: "1.35.3"
  PYYAML_VERSION: "6.0.2"
  CRD_SCHEMA_BASE: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main"

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - name: List apps
        id: list
        run: |
          apps=$(ls -d argocd/apps/*/ | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Discovered apps: ${apps}"

  validate:
    name: ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # Le CDN des releases GitHub (release-assets.githubusercontent.com) renvoie
      # regulierement des 5xx transitoires (502/504). Sans retry, un hoquet reseau
      # casse tout le job. On telecharge dans un fichier, on verifie le sha256
      # publie par le projet, puis on extrait : plus de pipe curl | tar qui masque
      # une reponse tronquee.
      - name: Install kustomize
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          asset="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          fetch() {
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 -o "$2" "$1"
          }
          fetch "${base}/${asset}" "${asset}"
          fetch "${base}/checksums.txt" checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "${asset}" -C /usr/local/bin kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          set -euo pipefail
          url="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 \
            -o kubeconform.tar.gz "${url}"
          tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Install PyYAML
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "pyyaml==${PYYAML_VERSION}"

      # Les generateurs KSOPS sont retires dans une copie temporaire : on valide
      # toutes les apps, y compris media/cert-manager/hermes/securo/traefik-forward-auth.
      # Les fichiers de secrets restent chiffres et ne sont pas rendus.
      - name: Render app with kustomize
        run: |
          ./scripts/ci/render-app.sh "${{ matrix.app }}" > rendered.yaml
          echo "Rendered $(grep -c '^kind:' rendered.yaml || echo 0) resources."

      - name: Validate with kubeconform
        # Schemas core Kubernetes + CRDs du catalogue Datree. Les CRDs inconnues
        # restent tolérées par -ignore-missing-schemas, mais les CRDs courantes
        # (Traefik, Cilium, CNPG, Longhorn, cert-manager, monitoring) sont validées.
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location "${CRD_SCHEMA_BASE}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-missing-schemas \
            rendered.yaml

  all-kustomize:
    name: all-kustomize
    needs: [discover, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check validation result
        run: |
          if [ "${{ needs.discover.result }}" != "success" ] || [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Une ou plusieurs apps ont échoué la validation kustomize/kubeconform."
            exit 1
          fi
          echo "Toutes les apps sont valides."
