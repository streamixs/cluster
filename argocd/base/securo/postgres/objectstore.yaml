# Depot des sauvegardes de securo-db: Silo (fork MinIO) sur une VM Proxmox,
# elle-meme sauvegardee chaque nuit sur TrueNAS.
#
# Un bucket et une cle dedies par base: une fuite dans un autre namespace ne
# donne pas acces aux sauvegardes des donnees financieres.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: securo-s3
  namespace: securo
spec:
  # Fenetre de restauration: n'importe quel instant des 30 derniers jours.
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-securo/
    endpointURL: http://192.168.1.7:9000
    s3Credentials:
      accessKeyId:
        name: securo-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: securo-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
