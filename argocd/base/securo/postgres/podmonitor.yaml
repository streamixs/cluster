# Scrape des metriques Postgres et Barman (port 9187), source des alertes de
# sauvegarde. `spec.monitoring.enablePodMonitor` est deprecie depuis CNPG 1.30.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: securo-db
  namespace: securo
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: securo-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
