# Reference des cles de securo-s3. Fichier NON chiffre: valeurs bidon uniquement.
#
# Le vrai secret est securo-s3.yaml, chiffre par SOPS. Il est livre avec des
# valeurs CHANGEME a remplacer par la cle Silo dediee au bucket cnpg-securo:
#
#     make secret-edit FILE=argocd/base/securo/secrets/securo-s3.yaml
apiVersion: v1
kind: Secret
metadata:
  name: securo-s3
  namespace: securo
type: Opaque
stringData:
  ACCESS_KEY_ID: "<access key Silo>"
  ACCESS_SECRET_KEY: "<secret key Silo>"
