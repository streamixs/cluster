# Reference des cles acceptees par securo-secret. Fichier NON chiffre et
# versionne: il ne doit contenir que des valeurs bidon.
#
# Le vrai secret est securo-secret.yaml, chiffre par SOPS. Pour l'editer:
#
#     make secret-edit FILE=argocd/base/securo/secrets/securo-secret.yaml
#
# SOPS ouvre le contenu dechiffre dans $EDITOR et rechiffre a la sauvegarde.
# Les valeurs ne touchent jamais le disque en clair.
#
# Le chart derive ces noms des cles camelCase de values.secret converties en
# SNAKE_CASE (secretKey -> SECRET_KEY). Elles sont injectees telles quelles
# dans les pods via envFrom, donc le nom doit etre exact.
#
# N'ajouter que les cles reellement utilisees: une cle absente laisse la
# fonctionnalite desactivee, ce qui est le comportement souhaite par defaut.
---
apiVersion: v1
kind: Secret
metadata:
  name: securo-secret
  namespace: securo
type: Opaque
stringData:
  # --- Obligatoire, deja renseigne -----------------------------------------
  # Cle de chiffrement applicative. Le chart livre par defaut
  # "dev-secret-change-in-production". Deja remplacee par une valeur generee.
  SECRET_KEY: "<64 caracteres aleatoires>"

  # NB: DATABASE_URL n'est volontairement PAS ici. Le mot de passe est genere
  # par CloudNativePG dans le Secret securo-db-app, et l'URL est recomposee a
  # l'execution par un patch `env` de la kustomization. Le mot de passe
  # n'existe donc nulle part dans Git, meme chiffre. Ne pas l'ajouter ici: une
  # entree `env` explicite l'emporte sur envFrom, la valeur serait ignoree et
  # donnerait l'illusion d'etre prise en compte.

  # --- OIDC / Pocket-ID ----------------------------------------------------
  # Client a creer manuellement dans Pocket-ID (hors cluster, 192.168.1.4).
  # Callback a declarer: https://securo.streamixs.com/api/auth/oidc/callback
  # Vides, l'OIDC natif reste inactif et l'acces repose sur forward-auth.
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""

  # --- Agregateurs bancaires ----------------------------------------------
  # Pluggy (Amerique latine principalement).
  PLUGGY_CLIENT_ID: ""
  PLUGGY_CLIENT_SECRET: ""

  # Enable Banking (Europe, PSD2). La cle privee est un PEM multi-lignes:
  # utiliser un bloc litteral `|-`, en indentant le contenu. Ne PAS la mettre
  # sur une seule ligne, et ne pas echapper les retours a la ligne.
  ENABLE_BANKING_APP_ID: ""
  ENABLE_BANKING_PRIVATE_KEY: |-
    -----BEGIN PRIVATE KEY-----
    <contenu du PEM, une ligne par ligne>
    -----END PRIVATE KEY-----

  # --- Taux de change ------------------------------------------------------
  # openexchangerates.org, necessaire uniquement en multi-devises.
  OPENEXCHANGERATES_APP_ID: ""

  # --- Agents IA -----------------------------------------------------------
  # Inutiles tant que config.agentsEnabled vaut false dans values.yaml.
  # Rappel: une cle OpenAI ou Anthropic fait sortir le contenu des
  # transactions du cluster. AGENTS_MCP_JWT_SECRET est en revanche purement
  # interne et doit etre genere si les agents sont actives, son defaut amont
  # etant "dev-mcp-secret-change-in-production".
  AGENTS_MCP_JWT_SECRET: ""
  AGENTS_OPENAI_API_KEY: ""
  AGENTS_ANTHROPIC_API_KEY: ""
  AGENTS_OPENAI_COMPAT_API_KEY: ""
