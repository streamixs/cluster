apiVersion: v1
kind: Secret
metadata:
  name: securo-secret
  namespace: securo
type: Opaque
stringData:
  # Cle de chiffrement applicative. Le chart livre par defaut
  # "dev-secret-change-in-production": la remplacer est imperatif.
  SECRET_KEY: "<64 caracteres aleatoires>"
  # Chaine de connexion complete. Le mot de passe doit etre identique a celui
  # de securo-db-credentials, que CloudNativePG utilise pour creer le role.
  DATABASE_URL: "postgresql+asyncpg://securo:<mot-de-passe>@securo-db-rw:5432/securo"
  # Client OIDC a creer manuellement dans Pocket-ID (hors cluster, 192.168.1.4).
  # Laisses vides, l'OIDC natif reste inactif et l'acces repose sur forward-auth.
  # Callback a declarer cote Pocket-ID: https://securo.streamixs.com/api/auth/oidc/callback
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
