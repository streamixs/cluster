installCRDs: true
replicaCount: 3
prometheus:
  # Permet a kube-prometheus-stack de scraper cert-manager.
  servicemonitor:
    enabled: true
extraArgs:
  - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
  - --dns01-recursive-nameservers-only
podDnsPolicy: None
podDnsConfig:
  nameservers:
    - 1.1.1.1
    - 9.9.9.9
