# Reference des cles acceptees par oauth2-proxy-secret. Fichier NON chiffre :
# ne jamais y mettre de vraies valeurs.
#
# Le vrai secret est oauth2-proxy-secret.yaml, chiffre par SOPS. Pour l'editer :
#
#     make secret-edit FILE=argocd/base/oauth2-proxy/secrets/oauth2-proxy-secret.yaml
#     make secret-keys FILE=argocd/base/oauth2-proxy/secrets/oauth2-proxy-secret.yaml
#
# Cote Pocket-ID, creer un client OIDC "oauth2-proxy" avec :
#   - redirect URI : https://oauth.streamixs.com/oauth2/callback
#   - scopes       : openid email profile
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: auth
type: Opaque
stringData:
  client-id: "<client id Pocket-ID>"
  client-secret: "<client secret Pocket-ID>"
  # openssl rand -base64 32
  cookie-secret: "<32 bytes base64>"
