# Middleware temporaire pour tester oauth2-proxy sans toucher au middleware
# `forward-auth` utilise par toutes les autres apps.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-oauth2
  namespace: auth
spec:
  forwardAuth:
    # Ne PAS utiliser /oauth2/auth : cet endpoint renvoie 401 sans cookie et
    # Traefik le transmet tel quel au navigateur ("Unauthorized"). Sur /,
    # oauth2-proxy renvoie 302 vers Pocket-ID si non authentifie, et 202 si
    # authentifie (OAUTH2_PROXY_UPSTREAMS=static://202).
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
