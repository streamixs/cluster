# Middleware temporaire pour tester oauth2-proxy sans toucher au middleware
# `forward-auth` utilise par toutes les autres apps.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-oauth2
  namespace: auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
