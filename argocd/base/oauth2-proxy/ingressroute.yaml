apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-callback
  namespace: auth
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`oauth.streamixs.com`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
  tls: {}
