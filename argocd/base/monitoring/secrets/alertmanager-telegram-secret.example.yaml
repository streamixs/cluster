# Reference du bot Telegram pour Alertmanager. Fichier NON chiffre.
# Le vrai secret est chiffre par SOPS.
#
# 1. Creer un bot dedie via @BotFather et recuperer le token.
# 2. Envoyer un message au bot, puis recuperer le chat_id :
#      curl -s "https://api.telegram.org/bot<TOKEN>/getUpdates"
# 3. Renseigner le secret :
#      make secret-edit FILE=argocd/base/monitoring/secrets/alertmanager-telegram-secret.yaml
#      make secret-keys FILE=argocd/base/monitoring/secrets/alertmanager-telegram-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
type: Opaque
stringData:
  bot-token: "<token @BotFather>"
