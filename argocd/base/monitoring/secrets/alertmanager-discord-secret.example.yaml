# Reference du webhook Discord pour Alertmanager. Fichier NON chiffre.
# Le vrai secret est chiffre par SOPS.
#
# Creer un webhook Discord (Server Settings > Integrations > Webhooks),
# puis :
#
#     make secret-edit FILE=argocd/base/monitoring/secrets/alertmanager-discord-secret.yaml
#     make secret-keys FILE=argocd/base/monitoring/secrets/alertmanager-discord-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-discord
  namespace: monitoring
type: Opaque
stringData:
  webhook-url: "https://discord.com/api/webhooks/REPLACE_WITH_ID/REPLACE_WITH_TOKEN"
