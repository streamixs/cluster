# Reference des cles du Secret Grafana. Fichier NON chiffre.
# Le vrai secret est chiffre par SOPS.
#
#     make secret-edit FILE=argocd/base/monitoring/secrets/grafana-admin-secret.yaml
#     make secret-keys FILE=argocd/base/monitoring/secrets/grafana-admin-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "<mot de passe Grafana>"
