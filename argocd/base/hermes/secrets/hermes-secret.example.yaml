# Reference des cles acceptees par hermes-secret. Fichier NON chiffre et
# versionne: il ne doit contenir que des valeurs bidon.
#
# Le vrai secret est hermes-secret.yaml, chiffre par SOPS. Pour l'editer:
#
#     make secret-edit FILE=argocd/base/hermes/secrets/hermes-secret.yaml
#
# SOPS ouvre le contenu dechiffre dans $EDITOR et rechiffre a la sauvegarde.
# Les valeurs ne touchent jamais le disque en clair.
#
# Ces cles sont injectees telles quelles dans le pod via envFrom, le nom doit
# donc etre exact. Tous ces noms ont ete verifies presents dans l'image
# nousresearch/hermes-agent:v2026.9.14.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secret
  namespace: hermes
type: Opaque
stringData:
  # --- Telegram ------------------------------------------------------------
  # Token delivre par @BotFather a la creation du bot. C'est la seule chose
  # qui authentifie la gateway aupres de Telegram: quiconque le detient peut
  # piloter le bot.
  TELEGRAM_BOT_TOKEN: "<token @BotFather>"

  # Liste blanche des user IDs autorises a parler au bot, separes par des
  # virgules. Recuperable via @userinfobot. Sans cette liste, n'importe qui
  # ayant trouve le nom du bot dialoguerait avec un agent qui a un acces en
  # lecture au cluster.
  TELEGRAM_ALLOWED_USERS: "123456789"

  # --- Dashboard -----------------------------------------------------------
  # PLUS AUCUNE CLE DASHBOARD ICI.
  #
  # Le dashboard s'arme automatiquement d'une porte d'authentification des
  # qu'il ecoute ailleurs que sur la loopback, et REFUSE de demarrer si aucun
  # provider n'est enregistre (durcissement amont de juin 2026;
  # HERMES_DASHBOARD_INSECURE est accepte mais ignore). Ce provider est
  # desormais l'OIDC Pocket-ID, pas le basic auth.
  #
  # Il est configure par des variables d'environnement du Deployment et non
  # ici, parce qu'aucune n'est secrete: le flux est authorization-code + PKCE
  # sur client public, donc sans client_secret, et un client_id circule en
  # clair dans l'URL d'autorisation.
  #
  #   HERMES_DASHBOARD_PUBLIC_URL      https://hermes.streamixs.com
  #   HERMES_DASHBOARD_OIDC_ISSUER     https://auth.streamixs.com
  #   HERMES_DASHBOARD_OIDC_CLIENT_ID  <client public declare dans Pocket-ID>
  #
  # Les anciennes cles HERMES_DASHBOARD_BASIC_AUTH_USERNAME et
  # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD ont ete retirees: un mot de passe
  # partage valable sur la meme URL que l'OIDC en annulait l'interet, et
  # constituait un second chemin d'entree vers un agent qui a acces a une
  # boite Gmail. Si elles trainent encore dans le secret chiffre, les
  # supprimer avec:
  #
  #     make secret-edit FILE=argocd/base/hermes/secrets/hermes-secret.yaml
