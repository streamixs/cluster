# Managed scope Hermes: couche de configuration poussee par l'operateur et
# NON modifiable depuis l'agent (Telegram, dashboard, CLI). Hermes la lit dans
# le dossier designe par HERMES_MANAGED_DIR et ses valeurs l'emportent sur
# celles de /opt/data/config.yaml ("managed wins at the leaf").
#
# Pourquoi ce detour plutot qu'un `hermes plugins enable` lance a la main:
# l'activation vit sinon dans config.yaml sur le PVC, donc hors de Git et
# perdue a la moindre recreation du volume. Ici elle est versionnee et
# reappliquee a chaque demarrage.
#
# Monte volontairement AILLEURS que /etc/hermes (le defaut): l'image y place
# deja image-provenance.json, qu'une ConfigMap montee au meme endroit
# masquerait.
#
# Une modification de cette ConfigMap n'entraine PAS de redemarrage du pod:
# le fichier monte est rafraichi par le kubelet et Hermes le relit (son cache
# est indexe sur mtime+taille), mais la liste des plugins n'est evaluee qu'au
# demarrage de la gateway. Apres un changement ici, forcer un
# `kubectl rollout restart deploy/hermes -n hermes`.
#
# N'y mettre que ce qui releve de l'infrastructure: quels plugins tournent, et
# ou se trouve le serveur d'inference. Le CHOIX du modele en est volontairement
# absent -- l'epingler interdirait d'en changer depuis Telegram, ce qui est un
# usage normal de l'agent. Declarer un provider ne fige pas ce choix: ca ajoute
# une entree au selecteur, l'utilisateur reste libre de la retenir ou non.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-managed
data:
  config.yaml: |
    # Les plugins bundled sont livres desactives ("opt-in default: nothing
    # enabled"). Sans cette liste, la gateway demarre sans aucune plateforme
    # et gateway_state.json reste a "platforms": {} -- le bot Telegram ne se
    # connecte jamais, alors meme que le token est valide et que `hermes
    # status` affiche "Telegram configured" (qui ne teste que la presence du
    # token, pas l'activation du plugin).
    plugins:
      enabled:
        - telegram-platform
        # Provider d'authentification OIDC du dashboard. Le plugin se decrit
        # comme s'auto-activant des qu'un issuer et un client_id sont presents,
        # mais plugins.enabled est une liste d'autorisation: absent d'ici, il
        # n'est pas charge du tout. Sans lui, le dashboard expose publiquement
        # retomberait sur le basic auth.
        - self-hosted

    # Serveur Ollama sur Proxmox, expose en OpenAI-compatible.
    #
    # Hermes n'a PAS de provider "ollama": ce nom n'est qu'un alias du profil
    # `custom`, un gabarit vide sans endpoint, et le seul provider Ollama
    # reellement livre est `ollama-cloud`, qui pointe sur https://ollama.com/v1.
    # Le selecteur de `hermes model` ne proposait donc aucune entree utilisable
    # pour une instance locale. On en declare une ici.
    #
    # api_mode chat_completions: c'est la surface qu'Ollama expose sous /v1,
    # il n'implemente pas l'API Responses.
    # discover_models: la liste vient de /v1/models, donc ajouter un modele sur
    # la VM suffit a le voir apparaitre, sans repasser par une PR.
    providers:
      ollama-local:
        base_url: http://192.168.1.22:11434/v1
        api_mode: chat_completions
        discover_models: true
