# Dashboard Hermes expose sur hermes.streamixs.com.
#
# Deux barrieres successives, volontairement:
#   1. forward-auth (Pocket-ID) au niveau de Traefik, comme pour les autres UI
#      du cluster;
#   2. l'OIDC natif du dashboard, qui verifie lui-meme l'ID token contre le
#      jwks_uri de Pocket-ID.
#
# Cette redondance se justifie ici plus qu'ailleurs: derriere cette URL il n'y
# a pas une interface de consultation mais un agent qui dispose d'un acces en
# lecture a une boite Gmail, en ecriture sur un calendrier et en lecture sur le
# cluster. Qui franchit l'authentification ne lit pas des donnees, il pilote
# l'agent.
#
# SEUL le port 9119 est expose. Le port 8642 est l'API programmatique de la
# gateway: elle n'a aucune raison d'etre joignable depuis Internet, et le
# Service la laisse accessible uniquement depuis le cluster.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.streamixs.com`)
      kind: Rule
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        - name: hermes
          port: 9119
  tls: {}
