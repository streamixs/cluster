# Dashboard Hermes expose sur hermes.streamixs.com.
#
# UNE seule authentification: l'OIDC natif du dashboard, qui verifie l'ID token
# contre le jwks_uri de Pocket-ID.
#
# Le middleware forward-auth a ete retire. Il faisait double emploi: les deux
# couches interrogeaient le meme Pocket-ID, et l'utilisateur devait donc
# s'authentifier deux fois de suite contre le meme fournisseur d'identite pour
# atteindre l'interface. Le gain de securite reel ne valait pas ce cout.
#
# Ce qu'on perd: une requete non authentifiee atteint desormais la pile HTTP du
# dashboard au lieu d'etre arretee par Traefik. C'est le fonctionnement normal
# d'une application qui gere son propre OIDC, et la verification du token reste
# faite contre le jwks_uri de Pocket-ID -- pas contre un cookie opaque.
#
# Le contexte reste le meme: derriere cette URL il n'y a pas une interface de
# consultation mais un agent qui dispose d'un acces en lecture a une boite
# Gmail, en ecriture sur un calendrier et en lecture sur le cluster. Qui
# franchit l'authentification ne lit pas des donnees, il pilote l'agent. C'est
# ce qui rend la reduction des scopes Gmail plus urgente que cette couche.
#
# SEUL le port 9119 est expose. Le port 8642 est l'API programmatique de la
# gateway: elle n'a aucune raison d'etre joignable depuis Internet, et le
# Service la laisse accessible uniquement depuis le cluster.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.streamixs.com`)
      kind: Rule
      services:
        - name: hermes
          port: 9119
  tls: {}
