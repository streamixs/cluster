apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tautulli
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tautulli.streamixs.com`)
      kind: Rule
      middlewares:
        # Test de migration oauth2-proxy (PR A1). Revenir a forward-auth
        # si le test echoue ; le cutover global se fera dans la PR A2.
        - name: forward-auth-oauth2
          namespace: auth
      services:
        - name: tautulli
          port: 8181
  tls: {}
