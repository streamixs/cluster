# Reference des cles de immich-s3. Fichier NON chiffre: valeurs bidon uniquement.
#
# Le vrai secret est immich-s3.yaml, chiffre par SOPS. Il est livre avec des
# valeurs CHANGEME a remplacer par la cle Silo dediee au bucket cnpg-immich:
#
#     make secret-edit FILE=argocd/base/immich/secrets/immich-s3.yaml
apiVersion: v1
kind: Secret
metadata:
  name: immich-s3
  namespace: immich
type: Opaque
stringData:
  ACCESS_KEY_ID: "<access key Silo>"
  ACCESS_SECRET_KEY: "<secret key Silo>"
