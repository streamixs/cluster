apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    env: prod
spec:
  description: Platform components managed by Argo CD
  # Ajouter ici tout nouveau depot Helm utilise par une Application.
  sourceRepos:
    - https://github.com/streamixs/cluster
    - https://traefik.github.io/charts
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - https://helm.cilium.io/
    - https://charts.longhorn.io
    - https://cloudnative-pg.github.io/charts
    - https://immich-app.github.io/immich-charts
    - https://grafana.github.io/helm-charts

  # Le namespace de destination de l'ApplicationSet est le nom du dossier
  # (argocd/apps/<app>). Certaines apps deploient dans un autre namespace via
  # leur kustomization : les deux doivent figurer ici.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: auth
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cilium
    - server: https://kubernetes.default.svc
      namespace: cilium-secrets
    - server: https://kubernetes.default.svc
      namespace: cloudnative-pg
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: external-services
    - server: https://kubernetes.default.svc
      namespace: hermes
    - server: https://kubernetes.default.svc
      namespace: immich
    - server: https://kubernetes.default.svc
      namespace: intel-gpu-plugin
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: longhorn
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: media
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: securo
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: traefik-forward-auth

  # Ressources cluster-scoped réellement rendues par les apps.
  # Les StorageClass et CSIDriver Longhorn sont créés par l'opérateur, pas par
  # ArgoCD : ne pas les ajouter ici sans manifeste explicite.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: ""
      kind: PersistentVolume
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy

  # Le perimetre est deja limite par destinations. Enumerer les types
  # namespaced serait plus strict mais casserait chaque nouveau composant ;
  # a faire app par app si necessaire.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
