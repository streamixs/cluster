# Cloisonnement reseau ArgoCD.
#
# Chaque policy selectionne un composant et active le deny-by-default dans les
# deux directions. Pour ne pas casser les flux internes, tout le trafic vers
# les autres pods du namespace `argocd` est autorise. Les flux externes sont
# ensuite ouverts explicitement : DNS, kube-apiserver, Pocket-ID pour le
# serveur, et les depots Git/Helm/OCI pour le repo-server.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  description: API/UI ArgoCD, joignable par Traefik et les composants ArgoCD
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
    - toFQDNs:
        - matchName: "auth.streamixs.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  description: Repo-server ArgoCD, acces Git/Helm/OCI et cache Redis
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
    # Depots Git, releases GitHub, charts Helm et OCI utilises par les apps.
    # Ajouter ici tout nouveau depot Helm/OCI avant de l'utiliser dans une app.
    - toFQDNs:
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchName: "codeload.github.com"
        - matchName: "raw.githubusercontent.com"
        - matchName: "objects.githubusercontent.com"
        - matchName: "pkg-containers.githubusercontent.com"
        # CDN utilise par GitHub pour les assets de release (charts Helm).
        - matchName: "release-assets.githubusercontent.com"
        - matchName: "ghcr.io"
        - matchName: "traefik.github.io"
        - matchName: "charts.jetstack.io"
        - matchName: "prometheus-community.github.io"
        - matchName: "helm.cilium.io"
        - matchName: "charts.longhorn.io"
        - matchName: "cloudnative-pg.github.io"
        - matchName: "immich-app.github.io"
        - matchName: "grafana.github.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
