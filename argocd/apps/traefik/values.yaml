service:
  annotations:
    lbipam.cilium.io/ips: "192.168.1.210"
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    allocateLoadBalancerNodePorts: false
deployment:
  replicas: 2
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

ingressRoute:
  dashboard:
    enabled: false

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: "0s"

tlsStore:
  default:
    defaultCertificate:
      secretName: streamixs-com-tls

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
