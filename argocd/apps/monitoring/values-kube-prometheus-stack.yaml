crds:
  enabled: true

defaultRules:
  create: true

alertmanager:
  enabled: true
  ingress:
    enabled: false
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      # Le chart ajoute sinon une route Watchdog -> receiver "null".
      # On route tout vers Telegram pour que le Watchdog teste le bot.
      routes: []
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            # A REMPLACER par le chat_id Telegram (voir docs/monitoring-alerting.md).
            # 123456789 est un placeholder valide pour amtool, pas un vrai chat.
            chat_id: -5447575468
            parse_mode: HTML
            send_resolved: true
  alertmanagerSpec:
    # Monte le secret alertmanager-telegram dans
    # /etc/alertmanager/secrets/alertmanager-telegram/
    secrets:
      - alertmanager-telegram
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  enabled: true
  # PVC RWO Longhorn : un RollingUpdate reste bloque (Multi-Attach) car
  # l'ancien pod garde le volume tant que le nouveau n'est pas ready.
  deploymentStrategy:
    type: Recreate
  admin:
    # Secret SOPS : grafana-admin (admin-user/admin-password)
    existingSecret: grafana-admin
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Paris
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: true
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        timeout: 60
        maxLines: 1000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP

prometheus:
  enabled: true
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    retention: 30d
    retentionSize: "45GB"
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  admissionWebhooks:
    patch:
      enabled: true

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: true

nodeExporter:
  enabled: true
kube-state-metrics:
  enabled: true
